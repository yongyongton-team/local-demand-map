# 값은 환경변수(또는 레포 루트의 .env)에서 읽어요. 없으면 오른쪽 기본값(로컬용)을 써요.
spring:
  application:
    name: local-demand-map
  config:
    # 레포 루트의 .env 를 읽어요. backend/ 에서 실행하면 ../.env, 레포 루트에서 실행하면 .env
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # bootRun 할 때는 compose.yaml 의 MySQL 접속 정보가 이 값보다 먼저 쓰여요.
    url: ${DATABASE_URL:jdbc:mysql://localhost:3307/local_demand}
    username: ${DB_USERNAME:local_demand}
    password: ${DB_PASSWORD:local_demand}
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)만 바꿔요. JPA는 엔티티와 테이블이 맞는지만 확인해요.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      # 서버를 꺼도 MySQL은 켜 둬서 다음 실행이 빨라요. 끄려면 docker compose stop
      lifecycle-management: start-only

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  demo-login:
    enabled: ${DEMO_LOGIN_ENABLED:true}
  demo-seed:
    # 시연용 예시 데이터(시연 계정, 구성동 과일 29명 등). 발표 서버에서만 true. 운영·테스트는 false
    # 켤 때마다 시연 계정을 발표 시작 상태로 되돌려요(서버를 다시 켜면 29 → 30 시연을 반복할 수 있어요)
    enabled: ${DEMO_SEED_ENABLED:false}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  ai:
    # fake: AI 없이 낱말 맞추기(개발·시연 예비용, 요약은 기본 문장). openai: OpenAI API (키를 넣어야 해요)
    provider: ${AI_PROVIDER:fake}
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    # 가장 싸고 빠른 GPT-6 모델(2026-11 기준). 바꾸면 그 모델이 reasoning_effort none 을 받는지 확인해요
    model: ${AI_MODEL:gpt-6-luna}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
    json-mode: ${AI_JSON_MODE:true}
    # none = 생각 없이 바로 답해요(빠르고 쌈). 업종 고르기·짧은 요약에는 충분해요. 비우면 보내지 않아요(모델 기본값 medium)
    reasoning-effort: ${AI_REASONING_EFFORT:none}
  jwt:
    # 입장권(JWT) 도장 키. 비워 두면 서버가 켜질 때마다 임시 키를 만들어요(로컬용). 배포 서버에는 꼭 넣어요.
    secret: ${JWT_SECRET:}
    # 손님 입장권 유효 기간(초). 30일 (명세 5-1)
    guest-ttl-seconds: 2592000
