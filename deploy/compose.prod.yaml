# 배포 서버의 MySQL. 서버 안(127.0.0.1)에서만 열고 밖으로는 열지 않아요.
# 비밀번호는 /etc/local-demand-map/app.env 에서 읽어요:
#   sudo docker compose -f /opt/local-demand-map/compose.prod.yaml --env-file /etc/local-demand-map/app.env up -d
# 로컬 개발용 backend/compose.yaml 과 이름을 달리해 DB 볼륨이 섞이지 않게 해요
name: local-demand-map-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: local_demand
      MYSQL_USER: ${DB_USERNAME:?app.env 에 DB_USERNAME 을 넣어요}
      MYSQL_PASSWORD: ${DB_PASSWORD:?app.env 에 DB_PASSWORD 를 넣어요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?app.env 에 DB_ROOT_PASSWORD 를 넣어요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 서버 메모리가 4GB라 MySQL이 쓰는 메모리를 줄여요(데이터가 작아서 충분해요)
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
