# 주소 하나로 화면과 API를 같이 내보내요. 같은 주소라 CORS 설정이 필요 없어요.
#   /           → 프론트 빌드 파일 (/var/www/local-demand-map)
#   /api/       → 백엔드 (127.0.0.1:8080, 밖에서는 직접 못 들어와요)
#   Swagger     → 백엔드 (프론트 개발자가 API를 보려고)
# setup-server.sh 가 /etc/nginx/sites-available/local-demand-map 으로 복사해요.
# https 를 붙이면(certbot --nginx) certbot 이 이 파일에 443 설정을 더해요.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/local-demand-map;
    index index.html;

    # 요청 문장은 200자라 본문이 클 일이 없어요
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 호출(최대 15초)보다 넉넉하게
        proxy_read_timeout 30s;
    }

    location ~ ^/(swagger-ui\.html|swagger-ui/|v3/api-docs) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite 빌드 파일은 이름에 해시가 붙어서 오래 저장해도 돼요
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 화면 주소(/resident, /founder/... )를 새로고침해도 index.html 을 줘요
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
